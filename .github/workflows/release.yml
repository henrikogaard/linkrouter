name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${DEVELOPER_ID_P12}" ]] || missing+=(DEVELOPER_ID_P12)
          [[ -n "${DEVELOPER_ID_P12_PASSWORD}" ]] || missing+=(DEVELOPER_ID_P12_PASSWORD)
          [[ -n "${APPSTORE_API_PRIVATE_KEY}" ]] || missing+=(APPSTORE_API_PRIVATE_KEY)
          [[ -n "${APPLE_TEAM_ID}" ]] || missing+=(APPLE_TEAM_ID)
          [[ -n "${APPSTORE_API_KEY_ID}" ]] || missing+=(APPSTORE_API_KEY_ID)
          [[ -n "${APPSTORE_ISSUER_ID}" ]] || missing+=(APPSTORE_ISSUER_ID)
          if (( ${#missing[@]} )); then
            echo "Missing signing credentials: ${missing[*]}"
            echo "Run ./scripts/setup-signing.sh locally, then re-run this workflow."
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      - name: Test
        run: |
          xcodebuild \
            -project LinkRouter.xcodeproj \
            -scheme LinkRouter \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            test

      - name: Archive and export Developer ID build
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -project LinkRouter.xcodeproj \
            -scheme LinkRouter \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/LinkRouter.xcarchive \
            -derivedDataPath build \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

          xcodebuild -exportArchive \
            -archivePath build/LinkRouter.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist

          test -d build/export/LinkRouter.app
          codesign --verify --deep --strict --verbose=2 build/export/LinkRouter.app

      - name: Notarize and staple
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APP="build/export/LinkRouter.app"
          KEY="/tmp/AuthKey.p8"
          printf '%s\n' "${APPSTORE_API_PRIVATE_KEY}" > "${KEY}"
          chmod 600 "${KEY}"

          SUBMIT_ZIP="/tmp/LinkRouter-submit.zip"
          ditto -c -k --keepParent "${APP}" "${SUBMIT_ZIP}"

          xcrun notarytool submit "${SUBMIT_ZIP}" \
            --key "${KEY}" \
            --key-id "${APPSTORE_API_KEY_ID}" \
            --issuer "${APPSTORE_ISSUER_ID}" \
            --wait

          xcrun stapler staple "${APP}"
          xcrun stapler validate "${APP}"
          rm -f "${KEY}" "${SUBMIT_ZIP}"

      - name: Package
        run: |
          set -euo pipefail
          APP="build/export/LinkRouter.app"
          mkdir -p dist
          ZIP="dist/LinkRouter-${VERSION}.zip"
          ditto -c -k --keepParent "${APP}" "${ZIP}"
          shasum -a 256 "${ZIP}" | tee dist/SHA256SUMS
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkRouter-${{ env.VERSION }}
          path: |
            dist/LinkRouter-${{ env.VERSION }}.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LinkRouter-${{ env.VERSION }}.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
