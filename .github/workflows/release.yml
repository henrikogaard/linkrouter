name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Test
        run: |
          xcodebuild \
            -project LinkRouter.xcodeproj \
            -scheme LinkRouter \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            test

      - name: Build Release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          xcodebuild \
            -project LinkRouter.xcodeproj \
            -scheme LinkRouter \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/LinkRouter.app"
          test -d "${APP}"
          mkdir -p dist
          ZIP="dist/LinkRouter-${VERSION}.zip"
          ditto -c -k --keepParent "${APP}" "${ZIP}"
          shasum -a 256 "${ZIP}" | tee dist/SHA256SUMS
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkRouter-${{ env.VERSION }}
          path: |
            dist/LinkRouter-${{ env.VERSION }}.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LinkRouter-${{ env.VERSION }}.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
